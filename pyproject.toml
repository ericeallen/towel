[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-towel"
version = "1.618"
description = "A Python tool that DRYs your code - finds and refactors repeated code using unification-based analysis"
authors = [
    {name = "Eric Allen"}
]
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[project.optional-dependencies]
format = ["black>=24.1.0", "isort>=5.12", "ruff>=0.4"]
types = ["mypy>=1.0.0", "pyright>=1.1"]
dev = [
    "pytest>=9.0.3",
    "build>=1.0.0",
    "bandit>=1.7.6",
    "coverage>=7.0.0",
    "black>=26.3.1",
    "isort>=5.12",
    "ruff>=0.4",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pyright>=1.1",
    "pre-commit>=3.0.0",
    "pydocstyle>=6.0.0",
    "hypothesis>=6.100",
    "pip-audit>=2.7",
    "tqdm>=4.66.0",
]

[project.urls]
Repository = "https://github.com/ericeallen/towel"
Issues = "https://github.com/ericeallen/towel/issues"

[project.scripts]
towel = "towel.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
towel = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
# Hostile fixtures are executed as written; reformatting would change what they test.
force-exclude = "tests/hostile_(cases|crossfile)/"
target-version = ['py311', 'py312', 'py313']

[tool.mypy]
python_version = "3.11"
# Enable strict type checking for the selected files
strict = true
warn_unused_configs = true
ignore_missing_imports = true

# Additional explicit settings (strict implies many of these)
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
warn_no_return = true
files = ["src/towel", "tests/test_helpers.py", "tests/edge_case_values.py"]

[tool.coverage.run]
source = ["src/towel"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
