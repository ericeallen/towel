[build-system]
requires = ["setuptools>=77.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "code-towel"
version = "1.772"
description = "A Python tool that DRYs your code - finds and refactors repeated code using anti-unification"
authors = [
    {name = "Eric Allen"}
]
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
license-files = ["LICENSE"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Operating System :: POSIX",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = []

[project.optional-dependencies]
format = ["black>=26.3.1", "isort>=5.12", "ruff>=0.4"]
types = ["mypy>=1.0.0", "pyright>=1.1"]
dev = [
    "pytest>=9.0.3",
    "build>=1.0.0",
    "bandit>=1.7.6",
    "coverage>=7.0.0",
    "black>=26.3.1",
    "isort>=5.12",
    "ruff>=0.4",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "pyright>=1.1",
    "pre-commit>=3.0.0",
    "pydocstyle>=6.0.0",
    "hypothesis>=6.100",
    "pip-audit>=2.7",
    "tqdm>=4.66.0",
]

[project.urls]
Repository = "https://github.com/ericeallen/towel"
Issues = "https://github.com/ericeallen/towel/issues"

[project.scripts]
towel = "towel.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.package-data]
towel = ["py.typed"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
# Hostile fixtures are executed as written; reformatting would change what they test.
force-exclude = "tests/hostile_(cases|crossfile)/"
target-version = ['py311', 'py312', 'py313']

[tool.mypy]
python_version = "3.11"
# Enable strict type checking for the selected files
strict = true
warn_unused_configs = true
ignore_missing_imports = true

# Additional explicit settings (strict implies many of these)
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unreachable = true
warn_unused_ignores = true
warn_no_return = true
files = ["src/towel", "tests"]
# Hostile fixtures are executed as written by the batteries; they are inputs, not code to check.
exclude = ["^tests/hostile_cases/", "^tests/hostile_crossfile/"]

# Test bodies are checked with every strict flag above, but the suite's unittest
# methods and pytest functions are largely unannotated and calling them from a
# runner adds nothing that a signature would catch; requiring signatures on more
# than a thousand of them buys no safety. The two typed support modules that were
# always strict stay strict below.
[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_calls = false

[[tool.mypy.overrides]]
module = ["tests.test_helpers", "tests.edge_case_values"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
disallow_untyped_calls = true

[tool.coverage.run]
source = ["src/towel"]
omit = ["*/tests/*", "*/__pycache__/*"]
# Pair evaluation forks worker processes (src/towel/unification/parallel.py);
# without multiprocessing tracing their bodies count as uncovered. Listing
# "thread" as well keeps the threading hook, which coverage drops when the
# list names only multiprocessing, so each worker's watchdog thread is traced
# too. Each process writes its own data file, so `coverage combine` must
# precede the report (see the justfile and .github/workflows/ci.yml).
concurrency = ["thread", "multiprocessing"]
parallel = true
sigterm = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
