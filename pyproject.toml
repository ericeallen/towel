[build-system]
requires = ["setuptools>=65.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "towel"
version = "0.6.7"
description = "A Python tool that DRYs your code - finds and refactors repeated code using unification-based analysis"
authors = [
    {name = "Eric Allen"}
]
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

# Zero external runtime dependencies!
dependencies = []

[project.optional-dependencies]
dev = [
    "coverage>=7.0.0",
    "black>=23.0.0",
    "flake8>=6.0.0",
    "mypy>=1.0.0",
    "tqdm>=4.66.0",
]

# No console_scripts exposed yet; scripts are provided under scripts/ for development

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py39', 'py310', 'py311', 'py312', 'py313']

[tool.mypy]
python_version = "3.11"
# Enable strict type checking for the selected files
strict = true
warn_unused_configs = true
ignore_missing_imports = true

# Additional explicit settings (strict implies many of these)
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_return_any = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
files = [
    "src/towel/unification/unifier.py",
    "src/towel/unification/extractor.py",
    "src/towel/unification/ast_pretty_printer.py",
    "src/towel/unification/ast_normalizer.py",
    "src/towel/unification/binding_detector.py",
    "src/towel/unification/models.py",
    "src/towel/unification/pipeline.py",
    "src/towel/unification/visitors.py",
]

[tool.flake8]
max-line-length = 100
exclude = ["venv", "env", "__pycache__", "tests"]
ignore = ["E501", "W503", "E203", "F541"]

[tool.coverage.run]
source = ["src/towel"]
omit = ["*/tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]
