name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen black --check src/towel tests scripts
      - run: uv run --frozen flake8 src/towel scripts tests
      - run: uv run --frozen mypy
      - run: uv run --frozen bandit -r src/towel scripts -ll
      # Inventory the frozen environment, excluding only the unpublished project.
      # --no-deps avoids resolving a different set: the export includes transitive deps.
      - run: |
          uv run --frozen python scripts/audit_dependencies.py > "$RUNNER_TEMP/towel-dependencies.txt"
          uv run --frozen python -m pip_audit --strict --no-deps --disable-pip --requirement "$RUNNER_TEMP/towel-dependencies.txt"
      - run: uv run --frozen python -m build

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen coverage run -m pytest -q
      - run: uv run --frozen coverage combine
      - run: uv run --frozen coverage report --fail-under=85
      - run: uv run --frozen coverage xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml

  macos-integration:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen python -m build
      # Replace the editable install and invoke its interpreter directly: uv run
      # could resync the project and silently test the checkout instead of the wheel.
      - run: uv pip install --reinstall --no-deps dist/*.whl
      - run: |
          .venv/bin/python -c 'import pathlib, sys, towel; assert pathlib.Path(towel.__file__).is_relative_to(sys.prefix), towel.__file__'
          .venv/bin/towel --version
          .venv/bin/python -m pytest -q tests/test_cli_integration.py tests/test_cli_input_errors.py tests/test_cli_output_safety.py tests/test_cli_result_contract.py tests/test_execution_budget.py tests/test_quickstart_workflow.py tests/test_public_api.py tests/test_change_transactions.py tests/test_recovery_journal.py tests/test_recovery_command_quoting.py tests/test_cli_oracle_lifecycle.py tests/test_formatting_worker_sharing.py tests/test_mypy_worker_isolation.py tests/test_differential_process_memory.py tests/test_parent_watchdog.py
