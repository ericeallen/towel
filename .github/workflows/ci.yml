name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install coverage

      - name: Run flake8
        run: |
          flake8 --max-line-length 100 --extend-ignore E501,W503,E203,F541 --exclude "venv,env,__pycache__,tests" src/towel/ scripts/

      - name: Run mypy
        run: |
          mypy

      - name: Run unit tests with coverage
        run: |
          python -m coverage run -m unittest discover -v
          python -m coverage report --fail-under=85
      - name: Enforce higher coverage for unification package
        run: |
          python -m coverage report --include="src/towel/unification/*" --fail-under=90

      - name: Generate coverage XML (artifact)
        if: always()
        run: |
          python -m coverage xml

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml
