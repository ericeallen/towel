name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.13'
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen black --check src/towel tests scripts
      - run: uv run --frozen flake8 src/towel scripts tests
      - run: uv run --frozen mypy
      - run: uv run --frozen bandit -r src/towel -ll
      # Known-vulnerability scan of the locked dependency set; once, not per interpreter.
      - run: uv run --frozen pip-audit --strict
      - run: uv run --frozen python -m build

  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e  # v6
      - run: uv sync --frozen --extra dev
      - run: uv run --frozen coverage run -m pytest -q
      - run: uv run --frozen coverage combine
      - run: uv run --frozen coverage report --fail-under=85
      - run: uv run --frozen coverage xml
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
