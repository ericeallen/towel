# --- Towel itself, at each released version --------------------------------
# Towel refactoring its own engine, whose tests then verify the engine still
# produces the recorded output on every example. `install` supplies the
# distribution metadata the version test reads; the dev tools are needed
# because the CLI formats with Black when it is present and the suite invokes
# them in places.

[[project]]
name = "towel-v1.414"
url = "https://github.com/ericeallen/towel.git"
rev = "4bb390b8a4e2a867b09e880290e8af777b62b37a"  # tag v1.414
package = "src/towel"
pythonpath = "src"
deps = ["tqdm", "black", "tomli", "hypothesis"]
install = true
timeout = 3600

[[project]]
name = "towel-v1.618"
