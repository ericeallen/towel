package = "src/towel"
pythonpath = "src"
deps = ["tqdm", "black", "tomli", "hypothesis"]
install = true
timeout = 3600

[[project]]
name = "towel-main"
url = "https://github.com/ericeallen/towel.git"
rev = "HEAD"  # on purpose: this entry tracks current main, never a fixed commit
package = "src/towel"
pythonpath = "src"
