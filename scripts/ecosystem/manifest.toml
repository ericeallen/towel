    "six",
]
# The ordinary selected suite also needs the bundled IANA timezone archive.
# Stage the public payload named by pinned zonefile_metadata.json locally before
# this offline hook; fail if absent, then let the unchanged upstream builder
# verify its SHA512 and build using the installed project's dependencies.
# pytest 8.4.2 satisfies upstream >=3.0 without pytest 9's generator-parametrize
# deprecation, which this pinned revision treats as an error.
post_install = [
    "{python}", "-c",
    "import json, runpy; from pathlib import Path; metadata = json.loads(Path('zonefile_metadata.json').read_text()); Path(metadata['tzdata_file']).read_bytes(); runpy.run_path('updatezinfo.py', run_name='__main__')",
]
# Retain the selected ordinary profile; property tests are a separate profile.
test = [
    "{python}", "-m", "pytest", "-q", "--ignore=tests/property",
]

