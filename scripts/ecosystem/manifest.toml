rev = "48bd1af97e71baf8e96fce5b663d589caac8f147"
package = "src/dateutil"
pythonpath = "src"
deps = [
    "attrs!=21.1.0",
    "build>=0.3.0; python_version >= \"3.6\"",
    "coverage",
    "freezegun; python_version != \"3.3\"",
    "hypothesis>=3.30",
    "mock; python_version < \"3.0\"",
    "pytest-cov>=2.0.0",
