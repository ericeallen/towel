# Ecosystem check manifest. Each project is cloned at `rev`, its suite run
# once as a baseline, refactored in a copy with the CLI defaults, and its
# suite run again. A project qualifies only when the two runs are identical.
#
# Fields: name, url, rev (commit or branch), package (path refactored, relative
# to the project root), pythonpath (for the test run), deps (test-only
# requirements installed into a private environment), test (command run from
# the project root; {python} is the environment interpreter), prepare
# (optional shell command run once after cloning), expect_broken (why the
# suite is expected to differ after transformation) with known_failures (test
# id substrings; the verdict is BROKEN_KNOWN only when every new failure
# matches one, otherwise BROKEN).

[[project]]
name = "tabulate"
url = "https://github.com/astanin/python-tabulate.git"
rev = "HEAD"
package = "tabulate"

[[project]]
name = "toolz"
url = "https://github.com/pytoolz/toolz.git"
rev = "HEAD"
package = "toolz"

[[project]]
name = "boltons"
url = "https://github.com/mahmoud/boltons.git"
rev = "HEAD"
package = "boltons"

[[project]]
name = "pyparsing"
url = "https://github.com/pyparsing/pyparsing.git"
rev = "HEAD"
package = "pyparsing"
deps = ["railroad-diagrams", "jinja2"]

[[project]]
name = "markdown-it-py"
url = "https://github.com/executablebooks/markdown-it-py.git"
rev = "HEAD"
package = "markdown_it"
deps = ["pytest-regressions", "mdurl", "linkify-it-py", "psutil", "pytest-benchmark"]

[[project]]
name = "more-itertools"
url = "https://github.com/more-itertools/more-itertools.git"
rev = "HEAD"
package = "more_itertools"
test = ["{python}", "-m", "unittest"]

