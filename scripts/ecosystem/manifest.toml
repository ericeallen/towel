rev = "HEAD"
package = "src/humanize"
pythonpath = "src"
deps = ["freezegun", "pytest-benchmark"]
test = ["{python}", "-m", "pytest", "-q", "-p", "no:cacheprovider", "--benchmark-disable"]
install = true

