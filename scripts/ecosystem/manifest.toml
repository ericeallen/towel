# Ecosystem check manifest. Each project is cloned at `rev`, its suite run
# once as a baseline, refactored in a copy with the CLI defaults, and its
# suite run again. A project qualifies only when the two runs are identical.
#
# Every `rev` is pinned to the full commit SHA the last release-gate run
# tested, because the harness executes each project's code (see the trust
# boundary in scripts/ecosystem_check.py): a pin means a hijacked upstream
# cannot put unreviewed code into the run. The one exception is towel-main,
# which must track current `main` and stays at "HEAD" on purpose. To refresh
# the pins: run the check, review the new commits, then print the commits the
# run tested with `python scripts/ecosystem_check.py --work <work> --print-pins`
# (it executes nothing) and replace the `rev` lines below with those SHAs,
# leaving towel-main alone. Run the check again before relying on the result.
#
# Fields: name, url, rev (full commit SHA; "HEAD" only for towel-main),
# package (path refactored, relative to the project root), pythonpath (for
# the test run), deps (test-only requirements installed into a private
# environment), test (command run from the project root; {python} is the
# environment interpreter), prepare (optional command run once after cloning,
# split into arguments and run without a shell), expect_broken (why the
# suite is expected to differ after transformation) with known_failures (test
# id substrings; the verdict is BROKEN_KNOWN only when every new failure
# matches one, otherwise BROKEN), timeout (seconds per phase for this project,
# overriding --timeout), exclude (directory names left out of the refactor,
# passed to `towel dry --exclude`).

