# --- Towel itself, at each released version --------------------------------
# Towel refactoring its own engine, whose tests then verify the engine still
# produces the recorded output on every example. A checkout's distribution is
# Towel's own, which the candidate holds in the environment, so the checkout is
# not installed and its version test reads the candidate's metadata. The dev
# tools are needed because the CLI formats with Black when it is present and
# the suite invokes them in places.

