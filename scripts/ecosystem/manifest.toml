# Ecosystem check manifest. Each project is cloned at `rev`, its suite run
# once as a baseline, refactored in a copy with the CLI defaults, and its
# suite run again. A project qualifies only when the two runs are identical.
#
# Fields: name, url, rev (commit or branch), package (path refactored, relative
# to the project root), pythonpath (for the test run), deps (test-only
# requirements installed into a private environment), test (command run from
# the project root; {python} is the environment interpreter), prepare
# (optional shell command run once after cloning), expect_broken (why the
# suite is expected to differ after transformation) with known_failures (test
# id substrings; the verdict is BROKEN_KNOWN only when every new failure
# matches one, otherwise BROKEN), timeout (seconds per phase for this project,
# overriding --timeout), exclude (directory names left out of the refactor,
# passed to `towel dry --exclude`).

