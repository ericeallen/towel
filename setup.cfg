[pydocstyle]
# Ignore list based on Google convention + pragmatic exceptions
# Google convention ignores: D203,D204,D213,D215,D400,D404,D406,D407,D408,D409,D413
# Additional pragmatic ignores:
# - D107: Missing docstring in __init__ (often self-explanatory from class docstring)
# - D102: Missing docstring in public method (many are AST visitor methods)
# - D105: Missing docstring in magic method
# - D202: No blank lines allowed after function docstring (conflicts with Black)
# - D401: First line should be imperative (too strict, conflicts with D200)
ignore = D107,D102,D105,D202,D203,D204,D213,D215,D400,D404,D406,D407,D408,D409,D413,D401
