[project]
name = "proj"
version = "0"
requires-python = ">=3.11"

[tool.pytest.ini_options]
# Round-4 audit P1-11: testpaths names pkg/helpers_x.py and the directory
# holding it, and pytest drops the file for the directory, so helpers_x.py
# is no initial path and pytest does not rewrite its asserts. Not test_*.py,
# so that Towel's own suite does not collect these modules.
testpaths = ["pkg/helpers_x.py", "pkg"]
python_files = ["check_*.py"]
