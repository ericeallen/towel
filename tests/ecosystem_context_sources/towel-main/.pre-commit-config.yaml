# Pre-commit hooks for Towel
# Install: pip install pre-commit && pre-commit install
# Run manually: pre-commit run --all-files

repos:
  - repo: local
    hooks:
      - id: black
        name: Black
        entry: python -m black --check --line-length=100
        language: system
        types: [python]
        exclude: ^(test_examples|\.templates/)
      - id: flake8
        name: Flake8
        entry: python -m flake8 --config=.flake8
        language: system
        types: [python]
        files: ^(src/towel/|scripts/|tests/)
        exclude: ^tests/(hostile_cases|hostile_crossfile)/
      - id: mypy
        name: Mypy
        entry: python -m mypy
        language: system
        pass_filenames: false
        always_run: true
      - id: bandit
        name: Bandit
        entry: python -m bandit -ll
        language: system
        types: [python]
        files: ^src/towel/

  # General pre-commit hooks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.5.0
    hooks:
      # Remove trailing whitespace
      - id: trailing-whitespace
        exclude: ^(test_examples.*_expected_output/|tests/(hostile_cases|hostile_crossfile)/)

      # Ensure files end with newline
      - id: end-of-file-fixer
        exclude: ^(test_examples.*_expected_output/|tests/(hostile_cases|hostile_crossfile)/)

      # Check YAML syntax
      - id: check-yaml

      # Prevent large files from being committed
      - id: check-added-large-files
        args: [--maxkb=500]

      # Check for merge conflicts
      - id: check-merge-conflict

      # Check TOML syntax
      - id: check-toml

      # Check for Python syntax errors
      - id: check-ast

      # Check for debugger imports
      - id: debug-statements

  # Docstring checking with pydocstyle (disabled for pre-commit, run manually)
  # - repo: https://github.com/pycqa/pydocstyle
  #   rev: 6.3.0
